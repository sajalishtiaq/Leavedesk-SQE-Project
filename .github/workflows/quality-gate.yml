name: quality-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Run all team tests with coverage
        run: python -m coverage run -m pytest
      - name: Coverage report (XML for Sonar)
        run: python -m coverage xml -o coverage.xml
      - name: Coverage gate (100 % statement + branch on business logic)
        run: python scripts/check_gates.py coverage
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: mutmut on business-rule modules
        run: ./scripts/run_mutation.sh
      - name: Mutation gate (>= 95 %)
        run: python scripts/check_gates.py mutation
      - name: Custom business-rule mutation operators
        run: python tools/custom_mutation.py
      - name: Custom operators gate (no killable survivor)
        run: python scripts/check_custom_mutation.py
      - uses: actions/upload-artifact@v4
        with: {name: mutation-evidence, path: docs/team/evidence}

  sonarqube:
    runs-on: ubuntu-latest
    needs: tests-and-coverage
    services:
      sonarqube:
        image: sonarqube:community
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fs http://localhost:9000/api/system/status | grep -q UP"
          --health-interval 20s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: coverage}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Create token and quality gate (coverage >= 85 %, 0 bugs/vulns, duplication <= 3 %)
        run: |
          pip install requests
          python scripts/sonar_setup.py http://localhost:9000
        env: {SONAR_ADMIN_PASSWORD: admin}
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      - name: Enforce Sonar quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
      - name: Show Sonar gate details
        if: always()
        run: |
          curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/qualitygates/project_status?projectKey=leavedesk-sqe" | python3 -m json.tool
          curl -s -u "$SONAR_TOKEN:" "http://localhost:9000/api/measures/component?component=leavedesk-sqe&metricKeys=coverage,bugs,vulnerabilities,code_smells,duplicated_lines_density,ncloc,sqale_index,security_hotspots" | python3 -m json.tool
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
