sonar.projectKey=leavedesk-sqe
sonar.projectName=LeaveDesk SQE
sonar.sources=backend/app
sonar.tests=tests/team
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/seed.py,**/migrations/**
sonar.coverage.exclusions=**/seed.py,backend/app/models.py,backend/app/__init__.py,backend/app/config.py,backend/app/extensions.py,backend/app/api/auth.py,backend/app/api/dashboard.py
