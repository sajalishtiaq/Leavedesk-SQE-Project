# header, no cookies are set (verified by source review). Limited to this one rule and file.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/app/__init__.py